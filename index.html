<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f7fb">
  <title>UniSR Calendar</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "SF Pro Text", Inter, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(120,145,255,.16), transparent 30%),
        radial-gradient(circle at 85% 85%, rgba(99,102,241,.12), transparent 32%),
        #f6f7fb;
      color: #111827;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
    }
    main { width: min(620px, 100%); text-align: center; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border: 1px solid rgba(17,24,39,.08);
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 13px;
      font-weight: 600;
      color: #4b5563;
      box-shadow: 0 8px 30px rgba(17,24,39,.05);
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4f46e5;
      box-shadow: 0 0 0 4px rgba(79,70,229,.10);
    }
    h1 {
      margin: 24px 0 12px;
      font-size: clamp(42px, 8vw, 64px);
      line-height: .98;
      letter-spacing: -0.055em;
      font-weight: 750;
    }
    p {
      margin: 0 auto;
      max-width: 500px;
      color: #6b7280;
      font-size: 16px;
      line-height: 1.6;
    }
    .card {
      margin-top: 34px;
      padding: 10px;
      display: flex;
      gap: 8px;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(17,24,39,.08);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(17,24,39,.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .url {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      padding: 0 14px;
      text-align: left;
      color: #6b7280;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      background: #111827;
      color: white;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }
    button:hover { background: #1f2937; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: #9ca3af;
    }
    @media (max-width: 520px) {
      body { padding: 18px; }
      .card { flex-direction: column; padding: 8px; }
      .url { height: 42px; padding: 0 12px; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <div class="badge"><span class="dot"></span> UniSR · International MD</div>
    <h1>UniSR Calendar</h1>
    <p>
      Your UniSR timetable, automatically updated and ready to subscribe
      to from Apple Calendar and other calendar apps.
    </p>

    <div class="card">
      <div class="url" id="calendarUrl"></div>
      <button id="copyButton" onclick="copyCalendarUrl()">Copy</button>
    </div>

    <div class="hint">Copy the calendar URL and add it as a calendar subscription.</div>
  </main>

  <script>
    const calendarUrl =
      "https://twentysecondproject.github.io/unirsr-calendar/calendario-unisr.ics";

    document.getElementById("calendarUrl").textContent = calendarUrl;

    async function copyCalendarUrl() {
      const button = document.getElementById("copyButton");
      try {
        await navigator.clipboard.writeText(calendarUrl);
        button.textContent = "Copied!";
        setTimeout(() => button.textContent = "Copy", 1600);
      } catch {
        const input = document.createElement("input");
        input.value = calendarUrl;
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        input.remove();
        button.textContent = "Copied!";
        setTimeout(() => button.textContent = "Copy", 1600);
      }
    }
  </script>
</body>
</html>
